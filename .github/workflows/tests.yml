name: Tests

on:
  # workflow_dispatch: {}  # temporarily enable the workflow for manual runs
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - main
      - 'pr/**/*'
      - 'wip/**/*'
    paths-ignore:
      - '**/*.md'

permissions:
 contents: read

jobs:
  tests:

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            framework: net8.0
          - os: ubuntu-26.04
            framework: net10.0
          - os: windows-2025
            framework: net48

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ubuntu-26.04 and windows-2025 have dotnet 10 and 8
      # installed already. If those images remove dotnet 8
      # use the following to make sure the correct dotnet
      # versions are installed:
      #
      # - name: Setup .NET
      #   uses: actions/setup-dotnet@v6
      #   with:
      #     dotnet-version: |
      #       10.0.x
      #       8.0.x

      - name: Check .ics fixtures for BOM
        shell: bash
        run: bash .github/workflows/EnsureIcsFixturesWithoutBOM.sh Ical.Net.Tests

      - name: Restore dependencies
        run: dotnet restore ./Ical.Net.Tests/Ical.Net.Tests.csproj

      - name: Build
        run: dotnet build ./Ical.Net.Tests/Ical.Net.Tests.csproj --no-restore --configuration Release -p:nowarn=1591 --framework ${{ matrix.framework }}

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --framework ${{ matrix.framework }}
